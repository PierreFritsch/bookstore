name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @sap/cds-dk
      - run: npm install
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
